# Hermes static-message catalog -- English (baseline / source of truth)
#
# Only user-facing static messages from the CLI approval prompt and a handful
# of gateway slash-command replies live here.  Agent-generated output, log
# lines, error tracebacks, and tool outputs stay outside this catalog. Gateway
# command/help menu chrome is translated here; command descriptions are translated
# in hermes_cli/commands.py.
#
# Keys are dotted paths; nesting below is purely for readability.  Values may
# contain {placeholder} tokens for str.format substitution.  When adding a
# new key, add it to EVERY locale file (en/zh/ja/de/es/fr/tr/uk) in the same commit --
# tests/agent/test_i18n.py asserts catalog parity.

approval:
  # CLI approval prompt -- shown when a dangerous command needs user review.
  dangerous_header: "⚠️  DANGEROUS COMMAND: {description}"
  choose_long:     "      [o]nce  |  [s]ession  |  [a]lways  |  [d]eny"
  choose_short:    "      [o]nce  |  [s]ession  |  [d]eny"
  prompt_long:     "      Choice [o/s/a/D]: "
  prompt_short:    "      Choice [o/s/D]: "
  timeout:         "      ⏱ Timeout - denying command"
  allowed_once:    "      ✓ Allowed once"
  allowed_session: "      ✓ Allowed for this session"
  allowed_always:  "      ✓ Added to permanent allowlist"
  denied:          "      ✗ Denied"
  cancelled:       "      ✗ Cancelled"
  blocklist_message: "This command is on the unconditional blocklist and cannot be approved."

gateway:
  # Messenger replies to slash commands and implicit state changes.
  approval_expired: "⚠️ Approval expired (agent is no longer waiting). Ask the agent to try again."
  draining:         "⏳ Draining {count} active agent(s) before restart..."
  goal_cleared:     "✓ Goal cleared."
  no_active_goal:   "No active goal."
  config_read_failed: "⚠️ Could not read config.yaml: {error}"
  config_save_failed: "⚠️ Could not save config: {error}"
  status_action:
    restarting: "restarting"
    shutting_down: "shutting down"
  busy:
    drain_queued: "⏳ Gateway {action} — queued for the next turn after it comes back."
    drain_reject_turn: "⏳ Gateway is {action} and is not accepting another turn right now."
    drain_reject_new: "⏳ Gateway is {action} and is not accepting new work right now."
    steered: "⏩ Steered into current run{status}. Your message arrives after the next tool call."
    queued: "⏳ Queued for the next turn{status}. I'll respond once the current task finishes."
    interrupting: "⚡ Interrupting current task{status}. I'll respond to your message shortly."
    status_elapsed: "{minutes} min elapsed"
    status_iteration: "iteration {iteration}/{max_iter}"
    status_running: "running: {tool}"
    still_working: "⏳ Still working... ({minutes} min elapsed{status})"
  stop:
    stopped: "⚡ Stopped. You can continue this session."
    stopped_before_start: "⚡ Stopped. The agent hadn't started yet — you can continue this session."
    no_active_task: "No active task to stop."
  queue:
    usage: "Usage: /queue <prompt>"
    queued: "Queued for the next turn."
    queued_count: "Queued for the next turn. ({count} queued)"
  steer:
    usage: "Usage: /steer <prompt>"
    usage_no_agent: "Usage: /steer <prompt>  (no agent is running; sending as a normal message)"
    agent_starting: "Agent still starting — /steer queued for the next turn."
    queued_preview: "⏩ Steer queued — arrives after the next tool call: '{preview}'"
    rejected_empty: "Steer rejected (empty payload)."
    no_active_agent: "No active agent — /steer queued for the next turn."
  agent_running:
    model_wait: "Agent is running — wait or /stop first, then switch models."
    goal_wait: "Agent is running — use /goal status / pause / clear mid-run, or /stop before setting a new goal."
    command_wait: "⏳ Agent is running — `/{command}` can't run mid-turn. Wait for the current response or `/stop` first."
  restart:
    already_in_progress: "⏳ Gateway restart already in progress..."
    started: "♻ Restarting gateway. If you aren't notified within 60 seconds, restart from the console with `hermes gateway restart`."
  commands:
    help_header: "📖 **Hermes Commands**\n"
    skill_header: "⚡ **Skill Commands** ({count} active):"
    skill_header_short: "⚡ **Skill Commands**:"
    more_skills_hint: "... and {count} more. Use `/commands` for the full paginated list."
    usage: "Usage: `/commands [page]`"
    skill_command_fallback: "Skill command"
    none_available: "No commands available."
    page_header: "📚 **Commands** ({total} total, page {page}/{total_pages})"
    prev_page: "`/commands {page}` ← prev"
    next_page: "next → `/commands {page}`"
    page_clamped: "_(Requested page {requested_page} was out of range, showing page {page}.)_"
    unknown: "Unknown command `/{command}`. Type /commands to see what's available, or resend without the leading slash to send as a regular message."
  session_info:
    model: "◆ Model: `{model}`"
    provider: "◆ Provider: {provider}"
    context: "◆ Context: {context} tokens ({source})"
    endpoint: "◆ Endpoint: {endpoint}"
    source_config: "config"
    source_default: "default — set model.context_length in config to override"
    source_detected: "detected"
  reset:
    session_reset: "✨ Session reset! Starting fresh."
    new_session: "✨ New session started!"
    new_session_named: "✨ New session started: {title}"
    title_rejected: "⚠️ Title rejected: {error}"
    title_rejected_untitled: "⚠️ {error} — session started untitled."
    title_empty_untitled: "⚠️ Title is empty after cleanup — session started untitled."
    tip: "✦ Tip: {tip}"
    tip_soul: "✦ Tip: SOUL.md is auto-seeded with a default personality on first run. Edit ~/.hermes/SOUL.md to customize."
  confirm:
    prompt: "⚠️ **Confirm /{command}**\n\n{detail}\n\nChoose:\n• **Approve Once** — {approve_once}\n• **Always Approve** — {always}\n• **Cancel** — {cancel}\n\n_Text fallback: reply `/approve`, `/always`, or `/cancel`._"
    destructive_approve_once: "proceed this time only"
    destructive_always: "proceed and silence this prompt permanently"
    destructive_cancel: "keep current conversation"
    destructive_cancelled: "🟡 /{command} cancelled. Conversation unchanged."
    destructive_always_note: "ℹ️ Future /clear, /new, /reset, and /undo will run without confirmation. Re-enable via `approvals.destructive_slash_confirm: true` in config.yaml."
    reload_mcp_detail: "Reloading MCP servers rebuilds the tool set for this session and **invalidates the provider prompt cache** — the next message will re-send full input tokens. On long-context or high-reasoning models this can be expensive."
    reload_mcp_approve_once: "reload now"
    reload_mcp_always: "reload now and silence this prompt permanently"
    reload_mcp_cancel: "leave MCP tools unchanged"
    reload_mcp_cancelled: "🟡 /reload-mcp cancelled. MCP tools unchanged."
    reload_mcp_always_note: "ℹ️ Future `/reload-mcp` calls will run without confirmation. Re-enable via `approvals.mcp_reload_confirm: true` in config.yaml."
